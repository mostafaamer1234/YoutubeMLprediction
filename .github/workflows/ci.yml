name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every module compiles
        run: python -m compileall -q src
      - name: Cross-validated evaluation (results in job summary)
        run: python src/evaluate_cv.py >> "$GITHUB_STEP_SUMMARY"
